campaign_context: |
  -- SETTING --

  It is a Time of Rebellion! Darth Vader has been slain, the second Death Star has
  been destroyed, the Battle of Endor has been won, the flames of resistance are
  leaping from system to system, a New Republic has arisen from the ashes of the Old,
  and the Jedi have returned!

  But even amidst this time of hope, the Empire is not yet defeated and the Dark Side
  has grown only stronger. Though the Emperor is dead, countless worlds remain in the
  grip of his tyranny and his Inquisitors and Dark Side acolytes roam the galaxy
  unchecked. Evil is everywhere.

  In the distant Outer Rim on the planet of VOLLON, the mysterious warlord LORD STRATUS
  leads an uprising against the evil Empire, even as a Republic Taskforce has been sent
  to engage the Imperial fleet. As the battle rages across and above the planet, a Jedi
  Knight has been dispatched by the new Jedi Council along with a team of Specialists
  from the New Republic on a secret mission to the surface — to learn the truth behind
  the mysterious LORD STRATUS and to free VOLLON from the grip of tyranny and darkness.

