session_transcripts:
  5: |
    Is that shipment needed, ma'am?

    Soon enough, hopefully, she says, looking at the door, at which point the camera cuts to the interior of the office. Where Wexer, about to speak to you, then turns his head at the sound of the banging on the metal door, echoing up into the office.

    C4V3 unhacks the Shinto-style gate, re-enabling the defense turrets, or whatever was in those gates.

    Go ahead and give me an easy mechanical or sensors, or security.

    I turn over to the left. I suppose we have another way out, the back door to this place. Or is that the back door?

    Of course I do.

    Good. Might be a good idea for us to leave.

    You are going to leave. You robbed me at the point of your laser sword, and made off with my shuttle.

    I did.

    Wait a minute, where's the proof?

    Well, the proof will be when you slash apart the controls of this desk.

    He looks at the large kind of obsidian kind of glass-topped desk that's fitted with all of these various, like, kind of spheres and buttons that are designed to activate various hollow screens, and he gestures at it meaningfully. C4V3 reports.

    Oh, that's easy enough. That's not too hard. So I'll take my thing and, you know, do what he asks.

    I'm afraid you're about to have to handle what he's doing, anyway, so...

    Okay, fair enough. Slice it up.

    The blades cut through. The glowing blade slices easily through the desk, and like sparks flash up from the desk brilliantly, almost like blindingly, with an electrical crackle. As this is occurring, Wexer moves, drawing a small sort of device, a little handheld from his robes that he presses, and a panel in the wall then slides up, revealing another kind of another balcony that is exposed to the cliffside, but is kind of halfway sheltered by the rock face and by a sort of canopy that has been folded over the opening to obscure it, but is now starting to fold open, long kind of metal fins in the purple silk canopy, raising up to lift and expose the open air of the canyon of Paul Jessek. On the platform there is a sleek custom repulsor craft that looks fitted for atmospheric — it's got a long kind of triangular viperish shape with wings that fold out from it. And it's a long kind of cab has room to occupy, you know, maybe a half dozen people, including a pilot, a co-pilot.

    Reporting defenses re-enabled.

    Nice. Shall we meet you somewhere, or meet someone somewhere?

    Why don't we all take this craft?

    No, I know, I know, we're gonna take this craft, but he said he was gonna be staying in time. Is there a location in the NAVA computer?

    All the other information in the computer you'll find has been wiped, he says, looking meaningfully at the droid.

    I immediately begin double-checking that statement.

    Yeah, seems to be true, though there is just a small amount of data which pertains to a single point of coordinates, and it's filed away in the navigational computer of this shuttle. Though everything else has been basically factory reset on the vehicle.

    Checks out.

    Fair enough. All right. Do you want to take it?

    Good luck to you, I hope to see you, and we will carry through.

    Where do we pick up our package?

    Make it to the rendezvous point, and we'll go from there.

    Exactly. To be clear, you will be there, or are we meeting someone else?

    You'll be meeting an associate of mine, ideally.

    Please tell us more. Any descriptions?

    Um, there's a large — there's the sound of hissing from the door, as that occurs, he kind of turns his head and says, "I don't think we have time."

    All right, let's go. Let's go.

    No argument here. Let's go.

    Meanwhile, on the other side of the door, a mechanical repair droid has been brought in off of the street, requisitioned by the Imperials, and is now crudely putting a plasma torch to the seal of the door. A handful of officers who have kind of perked up and are now all kind of standing at attention around the room as though they're doing something, kind of just watching what is occurring. Among them is, on the platform, Officer Sujan.

    I gotta ask. What's such aggressive ordinance at hand? Is our orders something to do with a Project Crucible that I keep hearing on the channel?

    She whips her eyes to you in those, like, large kind of goggly lenses that this kind of older woman wears, and her eyes whip to you and narrow.

    You are not cleared.

    Of course not, man, but word travels fast in these streets, and clearance hardly gets access to anybody. It's all just murmurs.

    He knows. The high-value asset is Stratus himself. The Inquisitor wants him, not just to end the rebellion, but for something. And at that, she kind of turns her head, and there's the sound of mechanical footsteps starting to ascend up the stairs into the cantina.

    Outside, you can hear the various kinds of movement of traffic has kind of died down a little bit, but you hear the faint, active hum of several imperial craft of some kind, some kind of patrol craft moving at a regular kind of pace from the hum outside of the building.

    Is it grav-lift hum that I'm hearing?

    Yeah, you'd guess so.

    And there are, at the metallic footsteps moving up the stairwell, you can see a column of figures moving up through the stairwell of the cantina. The Gamorrean stands aside, the bouncer, looking kind of frightened of these huge metallic figures, each standing seven and some change feet tall, with long kind of elongated metal heads and a vaguely kind of humanoid build that is kind of exaggerated in its physique and slender in the waist and kind of waspish. And this column of six sleek metal droids in black, gleaming metal, move up towards Officer Sujan. At a point they all stop, and the one in the lead moves towards the officer, who is looking, you know, expectantly at the droids as they advance, kind of nervously tapping her finger on the compad that is on her wrist.

    New Dark Trooper series, man? These are a gift from Atiscorp.

    I wasn't aware that Atiscorp was — she remarks to the adventurer. And the droid steps up and is towering over the two of you, at like seven, seven and a half, roughly, feet tall.

    Director Loodle sends his regards. We have been designed to disassemble over 11,000 sentient species and have been specifically modified for duty on Bolon.

    She's looking admiringly at the heavy machine. Excellent. What is your primary programming?

    Assassination.

    Now what are your orders?

    [Cut to interior — after Tyon's finished shooting Brick.]

    Yeah, I think we're loading up the craft. Yeah, we're getting the fuck out of there.

    Yeah, apart from the factory reset, the vehicle is dormant and the doors easily slide open as footsteps go up the little ramp that leads up into it.

    I get in and punch in the coordinates. Pretty straightforward, but we only have one data point.

    Yeah. Call up the nav map, and we will head on out.

