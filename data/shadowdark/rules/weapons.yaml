# Shadowdark weapons reference table (Player's Handbook, p. XX)
# Properties:
#   finesse    - Use STR or DEX
#   loading    - Must forgo move to reload
#   thrown     - Can throw using STR or DEX
#   two_handed - Requires both hands
#   versatile  - Higher damage with two hands (use damage_two_handed)
weapons:
